<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课堂同传 · 实时字幕</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d0f14; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px;
    color: #6b7280; border-bottom: 1px solid #1b1f2a; flex: none; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; flex: none; }
  #dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
  #status { flex: none; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btns { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .btns::-webkit-scrollbar { display: none; }
  #askBtn, #chatBtn, #modeBtn, #historyBtn { font-size: 12px; color: #9aa3b2; background: #1b1f2a; border: 1px solid #2a3040;
    border-radius: 8px; padding: 5px 10px; cursor: pointer; flex: none; white-space: nowrap; }
  #uiLang { font-size: 12px; color: #9aa3b2; background: #1b1f2a; border: 1px solid #2a3040;
    border-radius: 8px; padding: 5px 6px; cursor: pointer; flex: none; outline: none; color-scheme: dark; }
  #askBtn.on, #chatBtn.on, #historyBtn.on { background: #1d4d3a; border-color: #2f6b52; color: #e8eaf0; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px 40px; -webkit-overflow-scrolling: touch; }
  #current { min-height: 24vh; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12px; }
  #current .zh { font-size: clamp(24px, 5.2vw, 40px); line-height: 1.45; font-weight: 600; letter-spacing: 0.2px;
    word-break: break-word; }
  #current .ko { margin-top: 10px; font-size: clamp(13px, 2.2vw, 17px); line-height: 1.5; color: #7c8598;
    word-break: break-word; }
  #current .ko.hidden, #list .ko.hidden { display: none; }
  #waiting { color: #4b5563; font-size: 16px; text-align: center; padding: 40px 0; }
  #list { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }
  .row { padding: 10px 12px; border-left: 2px solid #22283a; }
  .row .zh { font-size: clamp(16px, 2.8vw, 21px); line-height: 1.55; color: #c9cfdb; }
  .row .ko { font-size: 13px; line-height: 1.5; color: #5d6577; margin-top: 5px; }
  .meta { font-size: 11px; color: #3f4657; margin-top: 6px; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #232a3a; border-radius: 3px; }

  /* 去掉顶部大字号实时区（用户要求：只在列表里看，不要跳“翻译中”和大字） */
  #current { display: none !important; }

  /* ---------- 学生提问面板（占据底部空间，不遮挡字幕） ---------- */
  .ask-panel { flex: none; display: none; background: #141821;
    border-top: 1px solid #232a3a; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ask-panel.open { display: block; }
  .ask-head { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #c9cfdb; margin-bottom: 10px; }
  #askClose { background: none; border: none; color: #6b7280; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
  #askText { width: 100%; min-height: 84px; resize: none; background: #0d0f14; color: #e8eaf0;
    border: 1px solid #2a3040; border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; outline: none; }
  #askText:focus { border-color: #2f6b52; }
  .ask-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #askHint { font-size: 12px; color: #6b7280; flex: 1; }
  #askSend { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  #askSend:disabled { opacity: .5; }
  #askResult { margin-top: 10px; font-size: 13px; color: #8b94a7; word-break: break-word; }
  #askVoice { background: #1b1f2a; color: #c9cfdb; border: 1px solid #2a3040; border-radius: 10px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; flex: none; }
  #askVoice.on { background: #7f1d1d; border-color: #b91c1c; color: #fff; }
  #askVoice:disabled { opacity: .45; }

  /* ---------- 课堂聊天室 ---------- */
  .chat-id { display: flex; gap: 8px; margin-bottom: 6px; }
  .chat-id input { flex: 1; background: #0d0f14; color: #e8eaf0; color-scheme: dark; border: 1px solid #2a3040;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; }
  .chat-id input:focus { border-color: #2f6b52; }
  .chat-hint { font-size: 11px; color: #6b7280; line-height: 1.5; margin-bottom: 8px; }
  #chatList { max-height: 30vh; overflow-y: auto; background: #0d0f14; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .cmsg { padding: 6px 0; border-bottom: 1px solid #1c2230; }
  .cmsg:last-child { border-bottom: none; }
  .cmsg .who { font-size: 11px; color: #7c869c; }
  .cmsg .czh { font-size: 14px; color: #e8eaf0; margin-top: 2px; word-break: break-word; }
  .cmsg .cko { font-size: 12px; color: #8b94a7; margin-top: 2px; word-break: break-word; }
  .chat-send-row { display: flex; gap: 8px; align-items: flex-end; }
  .img-pick { flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: #1b1f2a; border: 1px solid #2a3040; border-radius: 8px; cursor: pointer; font-size: 18px; }
  .cimg { max-width: 200px; max-height: 200px; border-radius: 8px; display: block; margin-top: 6px; }
  #chatText { flex: 1; min-height: 46px; max-height: 110px; resize: none; background: #0d0f14; color: #e8eaf0; color-scheme: dark;
    border: 1px solid #2a3040; border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; outline: none; }
  #chatText:focus { border-color: #2f6b52; }
  #chatSend { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  #chatSend:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span id="status">连接中…</span>
  <div class="btns">
    <button id="askBtn" data-i18n="ask">提问</button>
    <button id="chatBtn" data-i18n="chat">聊天室</button>
    <button id="historyBtn" data-i18n="hist">记录</button>
    <button id="modeBtn">只看中文</button>
  </div>
  <select id="uiLang" title="界面语言">
    <option value="zh">中文</option>
    <option value="ko">한국어</option>
    <option value="en">EN</option>
  </select>
</header>
<main id="main">
  <div id="waiting" data-i18n="waiting">等待老师开始讲话…</div>
  <div id="current">
    <div class="zh"></div>
    <div class="ko"></div>
  </div>
  <div id="list"></div>
</main>
<div class="ask-panel" id="askPanel">
  <div class="ask-head"><span data-i18n="askTitle">向老师提问</span><button id="askClose">×</button></div>
  <textarea id="askText" data-i18n-ph="askPh" placeholder="用中文输入问题，会翻译成韩语显示在老师的主机上"></textarea>
  <div class="ask-row">
    <span id="askHint" data-i18n="askHint">发送后老师主机上会出现韩语</span>
    <button id="askSend" data-i18n="send">发送</button>
  </div>
  <div id="askResult"></div>
  <div class="ask-row" style="margin-top:8px">
    <button id="askVoice">🎤 语音提问</button>
    <span id="voiceStat" style="font-size:12px;color:#6b7280;flex:1"></span>
  </div>
</div>
<div class="ask-panel" id="chatPanel">
  <div class="ask-head"><span data-i18n="chatTitle">课堂聊天室</span><button id="chatClose">×</button></div>
  <div class="chat-id">
    <input id="chatName" data-i18n-ph="name" placeholder="姓名" maxlength="20">
    <input id="chatSid" data-i18n-ph="sid" placeholder="学号，如 A12345" maxlength="20">
  </div>
  <div class="chat-hint" data-i18n="chatHint">先填一下学号和姓名，方便老师知道是谁在说话。</div>
  <div id="chatList"><div class="hint" data-i18n="empty">还没有人说话</div></div>
  <div class="chat-send-row">
    <label class="img-pick" title="发送图片">📷<input id="chatFile" type="file" accept="image/*" hidden></label>
    <textarea id="chatText" data-i18n-ph="chatPh" placeholder="中文会自动翻成韩语，韩语会自动翻成中文"></textarea>
    <button id="chatSend" data-i18n="send">发送</button>
  </div>
</div>
<div class="ask-panel" id="historyPanel">
  <div class="ask-head"><span data-i18n="histTitle">课程记录</span><button id="histClose">×</button></div>
  <div id="histList" style="max-height:52vh;overflow-y:auto"><div class="hint" data-i18n="loading">加载中…</div></div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const main = $('#main'), cur = $('#current'), list = $('#list'), waiting = $('#waiting');
  const dot = $('#dot'), status = $('#status'), modeBtn = $('#modeBtn');
  const askBtn = $('#askBtn'), askPanel = $('#askPanel'), askText = $('#askText'),
        askSend = $('#askSend'), askClose = $('#askClose'), askHint = $('#askHint'), askResult = $('#askResult');

  // ---------- 界面语言 ----------
  const I18N = {
    zh: {
      connecting: '连接中…', connected: '已连接', disconnected: '连接断开，重连中…',
      ask: '提问', chat: '聊天室', hist: '记录', onlyZh: '只看中文', showKo: '看原文',
      waiting: '等待老师开始讲话…',
      askTitle: '向老师提问', askPh: '用中文输入问题，会翻译成韩语显示在老师的主机上',
      askHint: '发送后老师主机上会出现韩语', send: '发送',
      chatTitle: '课堂聊天室', name: '姓名', sid: '学号，如 A12345',
      chatHint: '先填一下学号和姓名，方便老师知道是谁在说话。',
      empty: '还没有人说话', chatPh: '中文会自动翻成韩语，韩语会自动翻成中文',
      histTitle: '课程记录', loading: '加载中…',
      closedAsk: '老师还没开放提问', closedChat: '老师还没开放聊天室',
      sent: '已发送给老师', loadFail: '加载失败', translating: '翻译中…', imgReady: '图片已选好，点发送'
    },
    ko: {
      connecting: '연결 중…', connected: '연결됨', disconnected: '연결 끊김, 재연결 중…',
      ask: '질문', chat: '채팅', hist: '기록', onlyZh: '중국어만', showKo: '한국어 보기',
      waiting: '선생님의 말씀을 기다리는 중…',
      askTitle: '선생님께 질문', askPh: '중국어로 입력하면 한국어로 번역되어 선생님 화면에 표시됩니다',
      askHint: '보내면 선생님 화면에 한국어로 나타납니다', send: '보내기',
      chatTitle: '수업 채팅방', name: '이름', sid: '학번, 예: A12345',
      chatHint: '먼저 학번과 이름을 입력해 주세요.',
      empty: '아직 아무도 말하지 않았습니다', chatPh: '중국어는 한국어로, 한국어는 중국어로 자동 번역됩니다',
      histTitle: '수업 기록', loading: '불러오는 중…',
      closedAsk: '선생님이 아직 질문을 받지 않습니다', closedChat: '선생님이 아직 채팅방을 열지 않았습니다',
      sent: '선생님께 전송되었습니다', loadFail: '불러오기 실패', translating: '번역 중…', imgReady: '이미지 선택 완료, 보내기를 누르세요'
    },
    en: {
      connecting: 'Connecting…', connected: 'Connected', disconnected: 'Disconnected, reconnecting…',
      ask: 'Ask', chat: 'Chat', hist: 'Records', onlyZh: 'Chinese only', showKo: 'Show Korean',
      waiting: 'Waiting for the lecture to start…',
      askTitle: 'Ask the teacher', askPh: 'Type in Chinese; it will appear in Korean on the teacher screen',
      askHint: 'The teacher will see it in Korean', send: 'Send',
      chatTitle: 'Class chat', name: 'Name', sid: 'Student ID, e.g. A12345',
      chatHint: 'Please fill in your student ID and name first.',
      empty: 'No messages yet', chatPh: 'Chinese ↔ Korean is translated automatically',
      histTitle: 'Class records', loading: 'Loading…',
      closedAsk: 'The teacher has not opened questions yet', closedChat: 'The teacher has not opened the chat yet',
      sent: 'Sent to the teacher', loadFail: 'Failed to load', translating: 'Translating…', imgReady: 'Image ready, tap Send'
    }
  };
  const langSel = $('#uiLang');
  let lastStatusOk = null, lastStatusKey = 'connecting';
  let lang = localStorage.getItem('ct_lang') || 'zh';
  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k; }
  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    modeBtn.textContent = onlyZh ? t('showKo') : t('onlyZh');
    if (lastStatusOk === null) status.textContent = t('connecting');
    else status.textContent = t(lastStatusKey);
    if (typeof talkOpen !== 'undefined' && !talkOpen) {
      askHint.textContent = t('closedAsk');
      chatText.placeholder = t('closedChat');
    }
  }
  if (I18N[lang]) langSel.value = lang; else { lang = 'zh'; langSel.value = 'zh'; }
  langSel.onchange = () => {
    lang = langSel.value;
    localStorage.setItem('ct_lang', lang);
    applyLang();
  };

  let onlyZh = false;
  modeBtn.onclick = () => {
    onlyZh = !onlyZh;
    modeBtn.textContent = onlyZh ? t('showKo') : t('onlyZh');
    document.querySelectorAll('.ko').forEach(el => el.classList.toggle('hidden', onlyZh));
    cur.querySelector('.zh').classList.toggle('big', onlyZh);
  };

  // ---------- 学生提问 ----------
  let talkOpen = true;
  function openAsk() {
    askPanel.classList.add('open');
    askBtn.classList.add('on');
    setTimeout(() => { stick = true; follow(); }, 40);
    setTimeout(() => askText.focus(), 120);
  }
  function closeAsk() {
    askPanel.classList.remove('open');
    askBtn.classList.remove('on');
    setTimeout(() => { stick = true; follow(); }, 40);
  }
  askBtn.onclick = () => { if (askPanel.classList.contains('open')) closeAsk(); else { closeChat(); openAsk(); } };

  // ---------- 课堂聊天室 ----------
  const chatBtn = $('#chatBtn'), chatPanel = $('#chatPanel'), chatText = $('#chatText'),
        chatSend = $('#chatSend'), chatList = $('#chatList'),
        chatName = $('#chatName'), chatSid = $('#chatSid');
  let chatSending = false;
  $('#chatClose').onclick = () => closeChat();
  chatBtn.onclick = () => { if (chatPanel.classList.contains('open')) closeChat(); else { closeAsk(); closeHist(); openChat(); } };
  function openChat() {
    chatPanel.classList.add('open');
    chatBtn.classList.add('on');
    loadChat();
    setTimeout(() => { stick = true; follow(); }, 40);
    setTimeout(() => chatText.focus(), 120);
  }
  function closeChat() {
    chatPanel.classList.remove('open');
    chatBtn.classList.remove('on');
  }
  chatName.value = localStorage.getItem('ct_name') || '';
  chatSid.value = localStorage.getItem('ct_sid') || '';
  chatName.oninput = () => localStorage.setItem('ct_name', chatName.value);
  chatSid.oninput = () => localStorage.setItem('ct_sid', chatSid.value);
  let pendingImage = '';
  const chatFile = $('#chatFile');
  chatFile.onchange = () => {
    const f = chatFile.files && chatFile.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const max = 900;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      pendingImage = c.toDataURL('image/jpeg', 0.72);
      chatText.placeholder = t('imgReady');
      URL.revokeObjectURL(url);
    };
    img.onerror = () => URL.revokeObjectURL(url);
    img.src = url;
    chatFile.value = '';
  };
  function renderChat(m) {
    const h = chatList.querySelector('.hint'); if (h) h.remove();
    const d = document.createElement('div');
    d.className = 'cmsg';
    d.innerHTML = '<div class="who"></div><div class="czh"></div><div class="cko"></div>';
    const who = (m.from || '匿名') + (m.sid ? ' · ' + m.sid : '');
    d.querySelector('.who').textContent = who + ' · ' + new Date(m.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    d.querySelector('.czh').textContent = m.zh || '';
    d.querySelector('.cko').textContent = m.ko || '';
    if (m.image) {
      const im = document.createElement('img');
      im.className = 'cimg'; im.src = m.image; im.loading = 'lazy';
      d.appendChild(im);
    }
    chatList.appendChild(d);
    chatList.scrollTop = chatList.scrollHeight;
  }
  async function loadChat() {
    try {
      const j = await (await fetch('/api/chat')).json();
      const ms = j.messages || [];
      chatList.innerHTML = ms.length ? '' : '<div class="hint">' + t('empty') + '</div>';
      for (const m of ms) renderChat(m);
    } catch {}
  }
  async function sendChat() {
    if (chatSending) return;
    const text = chatText.value.trim();
    if (!text && !pendingImage) return;
    if (!talkOpen) { chatText.placeholder = t('closedChat'); return; }
    chatSending = true; chatSend.disabled = true;
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, image: pendingImage, name: chatName.value.trim(), sid: chatSid.value.trim() }),
      });
      const j = await r.json();
      if (j.ok) { chatText.value = ''; pendingImage = ''; chatText.placeholder = t('chatPh'); }
      else if (j.reason === 'disabled') { talkOpen = false; chatText.placeholder = t('closedChat'); }
      else if (j.reason === 'skip') { chatText.placeholder = '这句可能不是课堂内容，换个说法试试'; }
    } catch { chatText.placeholder = '网络错误，重试一下'; }
    finally { chatSending = false; chatSend.disabled = false; chatText.focus(); }
  }
  chatSend.onclick = sendChat;
  chatText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  // ---------- 课程记录（以前的课，随时回看） ----------
  const historyBtn = $('#historyBtn'), historyPanel = $('#historyPanel'), histList = $('#histList');
  $('#histClose').onclick = () => closeHist();
  function closeHist() { historyPanel.classList.remove('open'); historyBtn.classList.remove('on'); }
  function fmtTime(ms) { return new Date(ms).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function addEntries(box, es) {
    if (!es.length) { box.innerHTML = '<div class="hint">这节课没有内容</div>'; return; }
    for (const e of es) {
      const d = document.createElement('div');
      d.style.cssText = 'padding:8px 0;border-bottom:1px solid #1c2230';
      const t = new Date(e.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const who = e.kind === 'talk' ? (e.via === 'text' ? '学生（打字）' : '学生（说话）')
        : e.kind === 'chat' ? '聊天室 · ' + (e.from || '匿名') + (e.sid ? '（' + e.sid + '）' : '')
        : '老师';
      d.innerHTML = '<div style="font-size:11px;color:#5b6478"></div><div style="font-size:14px;color:#d8dee9;margin-top:3px;word-break:break-word"></div><div style="font-size:12px;color:#66708a;margin-top:2px"></div>';
      d.children[0].textContent = `${t} · ${who}`;
      d.children[1].textContent = (e.kind === 'talk' ? '学生：' : '') + (e.zh || '');
      d.children[2].textContent = e.ko || '';
      if (e.image) {
        const im = document.createElement('img');
        im.className = 'cimg'; im.src = e.image; im.loading = 'lazy';
        d.appendChild(im);
      }
      box.appendChild(d);
    }
  }
  async function openSessions() {
    histList.innerHTML = '<div class="hint">加载中…</div>';
    try {
      const j = await (await fetch('/api/sessions')).json();
      const list = (j.list || []).filter((s) => s.count > 0);
      histList.innerHTML = '';
      if (!list.length) { histList.innerHTML = '<div class="hint">还没有任何课堂记录</div>'; return; }
      const head = document.createElement('div');
      head.style.cssText = 'font-size:12px;color:#9aa3b2;margin-bottom:6px';
      head.textContent = '以前的课（点开看）';
      histList.appendChild(head);
      for (const s of list) {
        const d = document.createElement('div');
        d.style.cssText = 'padding:10px 0;border-bottom:1px solid #1c2230;cursor:pointer;display:flex;justify-content:space-between;align-items:center';
        d.innerHTML = '<span style="font-size:14px;color:#d8dee9"></span><span style="font-size:11px;color:#5b6478"></span>';
        d.children[0].textContent = fmtTime(s.start || s.mtime);
        d.children[1].textContent = s.count + ' 条';
        d.onclick = () => openOne(s.file);
        histList.appendChild(d);
      }
    } catch { histList.innerHTML = '<div class="hint">' + t('loadFail') + '</div>'; }
  }
  async function openOne(file) {
    histList.innerHTML = '<div class="hint">加载中…</div>';
    try {
      const j = await (await fetch('/api/session?file=' + encodeURIComponent(file))).json();
      histList.innerHTML = '';
      const back = document.createElement('div');
      back.textContent = '‹ 返回课程列表';
      back.style.cssText = 'font-size:12px;color:#9aa3b2;padding:0 0 8px;cursor:pointer';
      back.onclick = openSessions;
      histList.appendChild(back);
      const title = document.createElement('div');
      title.style.cssText = 'font-size:12px;color:#5b6478;margin-bottom:4px';
      title.textContent = fmtTime(new Date(j.start || 0).getTime());
      histList.appendChild(title);
      const box = document.createElement('div');
      histList.appendChild(box);
      addEntries(box, j.entries || []);
    } catch { histList.innerHTML = '<div class="hint">' + t('loadFail') + '</div>'; }
  }
  historyBtn.onclick = () => {
    if (historyPanel.classList.contains('open')) { closeHist(); return; }
    closeAsk();
    historyPanel.classList.add('open'); historyBtn.classList.add('on');
    setTimeout(() => { stick = true; follow(); }, 40);
    openSessions();
  };
  askClose.onclick = closeAsk;

  let sendingAsk = false;
  async function sendAsk() {
    const text = askText.value.trim();
    if (!text || sendingAsk) return;
    if (!talkOpen) { askHint.textContent = t('closedAsk'); return; }
    sendingAsk = true; askSend.disabled = true;
    askHint.textContent = t('translating');
    const ctrl = new AbortController();
    const tk = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch('/api/talk', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }), signal: ctrl.signal,
      });
      clearTimeout(tk);
      const j = await r.json();
      if (j.ok) {
        askText.value = '';
        askResult.innerHTML = '';
        const k = document.createElement('div');
        k.style.cssText = 'color:#c9cfdb;font-size:15px;line-height:1.5;margin-bottom:4px';
        k.textContent = j.ko;
        const s = document.createElement('div');
        s.style.cssText = 'color:#5d6577;font-size:12px';
        s.textContent = t('sent');
        askResult.appendChild(k); askResult.appendChild(s);
        askHint.textContent = '';
      } else if (j.reason === 'disabled') {
        talkOpen = false;
        askHint.textContent = t('closedAsk');
      } else {
        askHint.textContent = '这句可能不是课堂内容，换个说法试试';
      }
    } catch (e) {
      clearTimeout(tk);
      askHint.textContent = (e && e.name === 'AbortError') ? '翻译超时，再试一次' : '网络错误，重试一下';
    } finally {
      sendingAsk = false; askSend.disabled = false;
    }
  }
  askSend.onclick = sendAsk;
  askText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendAsk(); }
  });

  // ---------- 学生语音提问（手机麦克风，自动切段发服务器翻译） ----------
  const CID = (() => {
    let v = localStorage.getItem('ct_cid');
    if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem('ct_cid', v); }
    return v;
  })();
  const voiceStat = $('#voiceStat');
  const askVoiceBtn = $('#askVoice');
  const VSR = 16000, VOICE_SIL_MS = 750, VOICE_MIN_MS = 500, VOICE_MAX_MS = 8000;
  let stuOn = false, stuWs = null, stuCtx = null, stuStream = null, stuProc = null;
  let segParts = [], segLen = 0, quietMs = 0, talkMs = 0, preBuf = [];
  let voiceWaitTimer = null;

  function vstat(s) { if (voiceStat) voiceStat.textContent = s || ''; }

  function to16k(buf, rate) {
    if (rate === VSR) return buf;
    const r = rate / VSR, n = Math.round(buf.length / r), out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i * r, i0 = Math.floor(x), i1 = Math.min(buf.length - 1, i0 + 1), f = x - i0;
      out[i] = buf[i0] * (1 - f) + buf[i1] * f;
    }
    return out;
  }

  function toWav(samples) {
    const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, VSR, true); v.setUint32(28, VSR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    ws(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buf;
  }

  function flushVoice() {
    if (!segLen) return;
    const all = new Float32Array(segLen);
    let o = 0;
    for (const p of segParts) { all.set(p, o); o += p.length; }
    segParts = []; segLen = 0; quietMs = 0; talkMs = 0;
    if ((all.length / VSR) * 1000 < VOICE_MIN_MS) return;
    let sum = 0;
    for (let i = 0; i < all.length; i++) sum += all[i] * all[i];
    if (Math.sqrt(sum / all.length) < 0.004) return;
    if (!stuWs || stuWs.readyState !== 1) { vstat('还没连上服务器'); return; }
    stuWs.send(toWav(all));
    vstat('已发送，正在翻译…');
    clearTimeout(voiceWaitTimer);
    voiceWaitTimer = setTimeout(() => { vstat('没收到回应，可以再说一次'); }, 15000);
  }

  function voiceFrame(f32, rate) {
    const s = to16k(f32, rate);
    let sum = 0;
    for (let i = 0; i < s.length; i++) sum += s[i] * s[i];
    const rms = Math.sqrt(sum / s.length);
    const ms = (s.length / VSR) * 1000;
    const speaking = rms > 0.006;
    if (!segLen) {
      preBuf.push(s); if (preBuf.length > 8) preBuf.shift();
      if (!speaking) return;
      for (const p of preBuf) { segParts.push(p); segLen += p.length; }
      preBuf = []; quietMs = 0; talkMs = 0;
      return;
    }
    segParts.push(s); segLen += s.length;
    if (speaking) { quietMs = 0; talkMs += ms; } else { quietMs += ms; }
    if ((quietMs >= VOICE_SIL_MS && talkMs >= VOICE_MIN_MS) || segLen >= (VOICE_MAX_MS / 1000) * VSR) flushVoice();
  }

  function stopStuVoice() {
    stuOn = false;
    try { stuProc && stuProc.disconnect(); } catch {}
    try { stuStream && stuStream.getTracks().forEach((tr) => tr.stop()); } catch {}
    try { stuCtx && stuCtx.close(); } catch {}
    try { stuWs && stuWs.close(); } catch {}
    stuProc = stuCtx = stuStream = stuWs = null;
    segParts = []; segLen = 0; preBuf = []; quietMs = 0; talkMs = 0;
    if (askVoiceBtn) { askVoiceBtn.classList.remove('on'); askVoiceBtn.textContent = '🎤 语音提问'; }
    vstat('');
  }

  async function startStuVoice() {
    const diag = `[${location.protocol}//${location.host} secure=${window.isSecureContext} md=${!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)}]`;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      vstat('这个浏览器（或这个地址）不支持录音 ' + diag);
      return;
    }
    if (!window.isSecureContext) {
      vstat('必须用 https 或 localhost 打开才能录音 ' + diag);
      return;
    }
    if (!talkOpen) { vstat(t('closedAsk')); return; }
    let info;
    try { info = await (await fetch('/api/info')).json(); } catch { vstat('网络错误'); return; }
    if (!info.stuVoiceEnabled) { vstat('老师还没开放语音提问'); return; }
    const nm = (document.getElementById('chatName') || {}).value || localStorage.getItem('ct_name') || '';
    const sd = (document.getElementById('chatSid') || {}).value || localStorage.getItem('ct_sid') || '';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    stuWs = new WebSocket(`${proto}://${location.host}/ws/stu?cid=${CID}&name=${encodeURIComponent(nm)}&sid=${encodeURIComponent(sd)}`);
    stuWs.binaryType = 'arraybuffer';
    stuWs.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'disabled') { stopStuVoice(); vstat('老师还没开放语音提问'); }
      } catch {}
    };
    stuWs.onopen = async () => {
      try {
        stuStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        stuCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = stuCtx.createMediaStreamSource(stuStream);
        stuProc = stuCtx.createScriptProcessor(4096, 1, 1);
        const mute = stuCtx.createGain();
        mute.gain.value = 0;
        src.connect(stuProc); stuProc.connect(mute); mute.connect(stuCtx.destination);
        stuProc.onaudioprocess = (e) => { if (stuOn) voiceFrame(Float32Array.from(e.inputBuffer.getChannelData(0)), stuCtx.sampleRate); };
        stuOn = true;
        if (askVoiceBtn) { askVoiceBtn.classList.add('on'); askVoiceBtn.textContent = '⏹ 停止'; }
        vstat('正在听…说完停一下，会自动翻译');
      } catch (err) {
        stopStuVoice();
        vstat(err && err.name === 'NotAllowedError' ? '麦克风被拒绝，请在浏览器设置里允许' : '麦克风启动失败：' + (err && err.message ? err.message : err));
      }
    };
    stuWs.onerror = () => { vstat('连接失败'); };
  }

  if (askVoiceBtn) {
    askVoiceBtn.onclick = async () => {
      if (stuOn) { stopStuVoice(); return; }
      askVoiceBtn.disabled = true;
      try { await startStuVoice(); } finally { askVoiceBtn.disabled = false; }
    };
  }
  // 老师关掉提问时同步禁用
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !talkOpen) talkOpen = true;
  });

  function setStatus(ok, key) {
    lastStatusOk = ok; lastStatusKey = key;
    dot.classList.toggle('on', ok);
    status.textContent = t(key);
  }

  // ---------- 自动跟随最新一句 ----------
  const IDLE_MS = 30000;      // 用户停止操作后多久恢复自动跟随
  let stick = true;           // 是否跟随最新
  let autoScroll = false;     // 程序滚动中，避免自己的 scroll 触发暂停
  let idleTimer = 0;

  const atBottom = () => main.scrollHeight - main.scrollTop - main.clientHeight <= 40;

  function follow() {
    stick = true;
    clearTimeout(idleTimer); idleTimer = 0;
    autoScroll = true;
    main.scrollTop = main.scrollHeight;
    requestAnimationFrame(() => requestAnimationFrame(() => { autoScroll = false; }));
  }

  function pauseFollow() {
    stick = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(follow, IDLE_MS);
  }

  main.addEventListener('scroll', () => {
    if (autoScroll) return;
    if (atBottom()) {
      clearTimeout(idleTimer); idleTimer = 0; stick = true;
    } else {
      pauseFollow();
    }
  }, { passive: true });

  function renderCurrent(item) {
    if (!item) return;
    cur.querySelector('.zh').textContent = item.zh || '（翻译中…）';
    cur.querySelector('.ko').textContent = item.ko || '';
    cur.querySelector('.zh').style.opacity = item.zh ? 1 : .55;
    waiting.style.display = 'none';
    if (stick) follow();
  }

  function addToHistory(item) {
    const row = document.createElement('div');
    row.className = 'row';
    if (item.id) row.dataset.id = item.id;
    row.innerHTML = `<div class="zh"></div><div class="ko"></div><div class="meta"></div>`;
    row.querySelector('.zh').textContent = item.zh || '（未翻译）';
    row.querySelector('.ko').textContent = item.ko || '';
    row.querySelector('.meta').textContent = new Date(item.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    if (onlyZh) row.querySelector('.ko').classList.add('hidden');
    list.appendChild(row);
    if (stick) follow();
  }

  let ws = null, retry = 0, lastId = 0;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/view`);
    ws.onopen = () => { retry = 0; setStatus(true, 'connected'); };
    ws.onclose = () => {
      setStatus(false, 'disconnected');
      setTimeout(connect, Math.min(5000, 500 + retry * 500)); retry++;
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'init') {
        const es = msg.entries || [];
        chatList.innerHTML = '';
        if (es.length) {
          list.innerHTML = '';
          for (const e of es) {
            if (e.kind === 'chat') renderChat(e);
            else if (e.kind === 'talk') addToHistory({ t: e.t, zh: '学生：' + (e.zh || '') + (e.via === 'text' ? '（打字）' : ''), ko: e.ko });
            else { addToHistory({ t: e.t, zh: e.zh, ko: e.ko, id: e.id }); if (e.id) lastId = Math.max(lastId, e.id); }
          }
          const lastLec = [...es].reverse().find((e) => e.kind === 'lecture');
          if (lastLec) renderCurrent(lastLec);
          waiting.style.display = 'none';
        } else {
          waiting.style.display = msg.history.length ? 'none' : 'block';
          for (const h of msg.history) { addToHistory(h); renderCurrent(h); lastId = h.id; }
          for (const m of (msg.chat || [])) renderChat(m);
        }
      } else if (msg.type === 'chat') {
        renderChat(msg);
      } else if (msg.type === 'partial') {
        if (msg.id <= lastId) return;
        renderCurrent({ zh: msg.zh || '（翻译中…）', ko: msg.ko });
      } else if (msg.type === 'partial-cancel') {
        if (msg.id <= lastId) return;
        cur.querySelector('.zh').textContent = '';
        cur.querySelector('.ko').textContent = '';
      } else if (msg.type === 'subtitle') {
        if (msg.id <= lastId) return;
        lastId = msg.id;
        renderCurrent(msg);
        addToHistory(msg);
      } else if (msg.type === 'revision') {
        for (const r of list.querySelectorAll('.row')) {
          if (r.dataset.id === String(msg.id)) { r.querySelector('.zh').textContent = msg.zh; break; }
        }
        if (msg.id === lastId) renderCurrent({ zh: msg.zh, ko: msg.ko });
      } else if (msg.type === 'stu-skip') {
        if (msg.cid && msg.cid === CID) vstat('没听清，可以再说一次');
      } else if (msg.type === 'talk') {
        addToHistory({ t: msg.t, zh: (msg.via === 'text' ? '学生：' + msg.zh + '（打字）' : '学生：' + msg.zh), ko: msg.ko });
        if (msg.cid && msg.cid === CID) {
          clearTimeout(voiceWaitTimer);
          vstat('已发给老师');
          askResult.innerHTML = '';
          const s = document.createElement('div'); s.className = 'cnt'; s.textContent = '你说：' + (msg.zh || '');
          const k = document.createElement('div'); k.className = 'cnt'; k.style.color = '#7c8598'; k.textContent = msg.ko || '';
          askResult.appendChild(s); askResult.appendChild(k);
        }
      } else if (msg.type === 'resumed') {
        const es = msg.entries || [];
        list.innerHTML = '';
        chatList.innerHTML = '';
        lastId = 0;
        for (const e of es) {
          if (e.kind === 'chat') renderChat(e);
          else if (e.kind === 'talk') addToHistory({ t: e.t, zh: '学生：' + (e.zh || '') + (e.via === 'text' ? '（打字）' : ''), ko: e.ko });
          else { addToHistory({ t: e.t, zh: e.zh, ko: e.ko, id: e.id }); if (e.id) lastId = Math.max(lastId, e.id); }
        }
        const lastLec2 = [...es].reverse().find((e) => e.kind === 'lecture');
        if (lastLec2) renderCurrent(lastLec2);
        else { cur.querySelector('.zh').textContent = ''; cur.querySelector('.ko').textContent = ''; }
        waiting.style.display = es.length ? 'none' : 'block';
      } else if (msg.type === 'clear') {
        list.innerHTML = '';
        cur.querySelector('.zh').textContent = '';
        cur.querySelector('.ko').textContent = '';
        waiting.style.display = '';
      } else if (msg.type === 'talkState') {
        talkOpen = !!msg.enabled;
        if (!talkOpen) {
          askHint.textContent = t('closedAsk');
          chatText.placeholder = t('closedChat');
        } else {
          askHint.textContent = t('askHint');
          chatText.placeholder = t('chatPh');
        }
      } else if (msg.type === 'mode') {
        // 主机切到学生提问模式时，提示学生可以说话
      }
    };
  }
  applyLang();
  connect();

  // 屏幕常亮（支持的浏览器）
  (async () => {
    try {
      if ('wakeLock' in navigator) {
        let lock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen');
        });
      }
    } catch {}
  })();
})();
</script>
</body>
</html>
