<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>对老师说 · 中文 → 韩语</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14; --card: #121826; --line: #223047;
    --pri: #6ea8fe; --txt: #e8edf7; --dim: #8b9bb4; --ok: #6ee7a8; --warn: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--dim); }
  header .state { margin-left: auto; font-size: 12px; color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; margin-top: 40px; line-height: 1.8; }
  .msg {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg .zh { font-size: 13px; color: var(--dim); margin-bottom: 6px; word-break: break-word; }
  .msg .ko { font-size: 20px; line-height: 1.45; font-weight: 600; word-break: break-word; }
  .msg .ko.pending { color: var(--dim); font-weight: 400; font-size: 14px; }
  .msg.fail .ko { color: var(--warn); font-size: 14px; font-weight: 400; }
  footer {
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; background: var(--bg);
  }
  #txt {
    flex: 1; resize: none; height: 46px; max-height: 120px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--txt); font-size: 16px; font-family: inherit; outline: none;
  }
  #txt:focus { border-color: var(--pri); }
  #send {
    width: 86px; border: 0; border-radius: 12px; background: var(--pri);
    color: #07101f; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  .hint { font-size: 11px; color: var(--dim); padding: 0 14px 6px; }
</style>
</head>
<body>
<header>
  <h1>对老师说</h1>
  <span class="sub">输入中文 → 韩语</span>
  <span class="state" id="state">就绪</span>
</header>
<main id="list">
  <div class="empty">在这里输入中文，会翻译成韩语。<br>只显示文字，不会发出任何声音。</div>
</main>
<footer>
  <textarea id="txt" placeholder="输入中文，Ctrl+Enter 发送" rows="1"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list');
const txt = $('#txt');
const sendBtn = $('#send');
const stateEl = $('#state');

let talkOpen = true;

// 加载时检查主机是否开放提问
fetch('/api/info').then(r => r.json()).then(info => {
  if (info.talkEnabled === false) {
    talkOpen = false;
    stateEl.textContent = '老师还没开放提问';
    txt.disabled = true;
    sendBtn.disabled = true;
    txt.placeholder = '当前未开放提问';
  }
}).catch(() => {});

function escapeNode(el, text) { el.textContent = text; }

function addMessage(zh, ko, cls) {
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg' + (cls ? ' ' + cls : '');
  const zhEl = document.createElement('div');
  zhEl.className = 'zh';
  zhEl.textContent = zh;
  const koEl = document.createElement('div');
  koEl.className = 'ko' + (cls === 'pending' ? ' pending' : '');
  koEl.textContent = ko;
  div.append(zhEl, koEl);
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
  return { div, koEl };
}

let sending = false;
async function send() {
  const text = txt.value.trim();
  if (!text || sending || !talkOpen) return;
  sending = true;
  sendBtn.disabled = true;
  stateEl.textContent = '翻译中…';
  txt.value = '';
  const { div, koEl } = addMessage(text, '翻译中…', 'pending');
  try {
    const r = await fetch('/api/talk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const j = await r.json();
    if (j.ok) {
      koEl.textContent = j.ko;
      koEl.classList.remove('pending');
      stateEl.textContent = '就绪';
    } else if (j.reason === 'disabled') {
      talkOpen = false;
      div.classList.add('fail');
      koEl.classList.remove('pending');
      koEl.textContent = '老师还没开放提问';
      stateEl.textContent = '未开放';
      txt.disabled = true;
      txt.placeholder = '当前未开放提问';
    } else {
      div.classList.add('fail');
      koEl.classList.remove('pending');
      koEl.textContent = j.reason === 'skip' ? '（无有效内容）' : '翻译失败';
      stateEl.textContent = '失败';
    }
  } catch (e) {
    div.classList.add('fail');
    koEl.classList.remove('pending');
    koEl.textContent = '网络错误：' + e.message;
    stateEl.textContent = '离线';
  } finally {
    sending = false;
    sendBtn.disabled = !talkOpen;
    if (talkOpen) txt.focus();
  }
}

sendBtn.addEventListener('click', send);
txt.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.shiftKey)) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
